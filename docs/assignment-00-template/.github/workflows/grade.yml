name: Grade Assignment 00

# Runs on every push. When the run completes, GitHub notifies the school via a
# workflow_run webhook, and the school performs the authoritative grade
# (protected-file verification + profile validation) server-side.
on:
  push:
  workflow_dispatch:

# Least privilege: grading only needs to read the checked-out code.
permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out submission
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Validate student/profile.json
        run: node scripts/grade.mjs
